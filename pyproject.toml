[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-iceberg-agent"
version = "0.1.0"
description = "A reviewable, reversible LLM agent for Apache Iceberg table changes (synthetic-data demo)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Kushagra Soni" }]
dependencies = [
  "pyiceberg[sql-sqlite,pyarrow]>=0.10,<0.13",
  "duckdb>=1.1",
  "faker>=24",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gia = "governed_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
governed_agent = ["default_policy.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Delete operation did not match any records:UserWarning"]
