name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Smoke test - offline demo (plain log)
        env:
          GIA_HOME: ${{ runner.temp }}/gia-demo
        run: gia demo --fast

      - name: Smoke test - story mode (non-interactive, no pauses)
        env:
          GIA_HOME: ${{ runner.temp }}/gia-story
        run: gia demo --story < /dev/null
